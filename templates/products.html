{% extends "base.html" %}
{% block content %}
<section class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="mb-1">DevOps Storefront</h1>
      <p class="lead mb-0">Production-ready services, billed monthly.</p>
    </div>
    <span class="version-badge version-{{ version }}">
      <i class="bi bi-server"></i> Served by {{ version|upper }}
    </span>
  </div>

  <div class="row g-4">
    {% for item in items %}
    <div class="col-md-6 col-lg-4">
      <div class="glass-card product-card p-4 h-100">
        <div class="d-flex align-items-center mb-3">
          <i class="bi {{ item.icon }} fs-1 text-warning me-3"></i>
          <div>
            <h5 class="mb-0">{{ item.name }}</h5>
            <small class="text-light-emphasis">{{ item.price }}</small>
          </div>
        </div>
        <p class="mb-3">{{ item.desc }}</p>
        <button class="btn btn-outline-light btn-sm w-100">
          <i class="bi bi-cart-plus"></i> Add to Cart
        </button>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
