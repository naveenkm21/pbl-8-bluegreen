<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudOps Dashboard — {{ page|capitalize }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --blue-grad: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
      --green-grad: linear-gradient(135deg, #198754 0%, #20c997 100%);
    }
    body {
      min-height: 100vh;
      background: {% if version == 'green' %}var(--green-grad){% else %}var(--blue-grad){% endif %};
      background-attachment: fixed;
      color: #f8f9fa;
      transition: background 0.8s ease;
    }
    .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
    .glass-card {
      background: rgba(20, 22, 30, 0.65);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
    }
    .version-badge {
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.5px;
      animation: pulse 2.4s infinite;
    }
    .version-blue  { background: #0d6efd; color: #fff; }
    .version-green { background: #198754; color: #fff; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.6); }
      70%  { box-shadow: 0 0 0 14px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
    .hero { padding: 5rem 0 3rem; }
    .hero h1 { font-size: 3rem; font-weight: 800; }
    .product-card { transition: transform .25s ease, box-shadow .25s ease; }
    .product-card:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(0,0,0,0.45); }
    footer { background: rgba(0,0,0,0.45); padding: 1.5rem 0; margin-top: 4rem; }
    .meta { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 0.85rem; opacity: 0.85; }
    .switch-flash { animation: flash 0.9s ease; }
    @keyframes flash {
      0%   { filter: brightness(2.0); }
      100% { filter: brightness(1.0); }
    }
  </style>
</head>
<body id="appBody">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-opacity-75 sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="bi bi-cloud-arrow-up-fill"></i> CloudOps
      </a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="nav" class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link {% if page=='home' %}active{% endif %}"     href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link {% if page=='products' %}active{% endif %}" href="/products">Products</a></li>
          <li class="nav-item"><a class="nav-link {% if page=='contact' %}active{% endif %}"  href="/contact">Contact</a></li>
        </ul>
        <span class="me-3 meta">build #<span id="liveBuild">{{ build }}</span></span>
        <span id="liveBadge" class="version-badge version-{{ version }}">
          <i class="bi bi-circle-fill"></i> LIVE: <span id="liveVersion">{{ version|upper }}</span>
        </span>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="text-center text-light-emphasis">
    <div class="container meta">
      &copy; {{ year }} CloudOps Inc. &mdash; pod <code>{{ host }}</code> serving <strong>{{ version|upper }}</strong>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Real-time version poller — proves zero-downtime traffic switch.
    let currentVersion = "{{ version }}";
    async function poll() {
      try {
        const r = await fetch("/version", { cache: "no-store" });
        if (!r.ok) return;
        const j = await r.json();
        const badge   = document.getElementById("liveBadge");
        const label   = document.getElementById("liveVersion");
        const buildEl = document.getElementById("liveBuild");
        buildEl.textContent = j.build;
        if (j.version !== currentVersion) {
          currentVersion = j.version;
          label.textContent = j.version.toUpperCase();
          badge.classList.remove("version-blue", "version-green");
          badge.classList.add("version-" + j.version);
          document.body.style.background =
            j.version === "green"
              ? "linear-gradient(135deg,#198754 0%,#20c997 100%)"
              : "linear-gradient(135deg,#0d6efd 0%,#6610f2 100%)";
          document.body.classList.add("switch-flash");
          setTimeout(() => document.body.classList.remove("switch-flash"), 900);
        }
      } catch (e) { /* ignore transient errors */ }
    }
    setInterval(poll, 2000);
  </script>
</body>
</html>
