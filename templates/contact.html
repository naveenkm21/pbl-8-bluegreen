{% extends "base.html" %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="glass-card p-5">
        <h1 class="mb-3"><i class="bi bi-envelope-paper"></i> Get in touch</h1>
        <p class="lead">Tell us about your deployment challenges. We'll reach back within one business day.</p>
        <form onsubmit="event.preventDefault(); alert('Thanks! (demo only)');">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input class="form-control" required placeholder="Ada Lovelace">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" required placeholder="ada@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4" required placeholder="We need zero-downtime deploys..."></textarea>
          </div>
          <button class="btn btn-warning btn-lg w-100">
            <i class="bi bi-send"></i> Send message
          </button>
        </form>
        <hr class="my-4">
        <p class="meta mb-0">
          Response served by pod <code>{{ host }}</code> &middot; version
          <span class="version-badge version-{{ version }}">{{ version|upper }}</span>
        </p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
