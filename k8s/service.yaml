apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  labels:
    app: myapp
spec:
  # LoadBalancer works on Docker Desktop K8s — exposed at http://localhost:30008
  # and routes through real kube-proxy, so selector changes take effect instantly.
  type: LoadBalancer
  selector:
    app: myapp
    version: blue   # <-- traffic-routing label, patched by Jenkins to switch colors
  ports:
    - name: http
      protocol: TCP
      port: 30008      # exposed host port
      targetPort: 5000 # container port
      nodePort: 30008  # also keeps NodePort for compatibility
