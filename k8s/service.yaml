# Public service — selector.color is patched by the pipeline to switch traffic.
apiVersion: v1
kind: Service
metadata:
  name: pbl8-app-svc
  labels:
    app: pbl8-app
spec:
  type: NodePort
  selector:
    app: pbl8-app
    color: blue        # <-- ACTIVE color; flipped to green on cutover
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
